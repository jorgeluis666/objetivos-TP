name: Alerta semanal de Meta Ads

# Correo con el estado del mes de Meta Ads (scripts/alertas.js), con la estetica del tablero.
#
# El repo no guarda los datos: viven en el Web App del barrido y el build los incrusta en la pagina.
# Asi que la alerta los pide igual que el build, con el secreto TP_DATA_ENDPOINT, que ya existe.
on:
  # Todos los lunes a las 7:00 a. m. de Lima (12:00 UTC).
  schedule:
    - cron: '0 12 * * 1'

  # Despues de cada publicacion: solo manda si cambiaron las cifras del mes. El barrido de Drive no
  # vive en este repo (es un disparador de Apps Script), asi que la publicacion es la senal mas
  # cercana a "los datos se movieron".
  workflow_run:
    workflows: ["Publicar en GitHub Pages"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulación (no envía email real)'
        type: boolean
        default: true
      reenviar:
        description: 'Reenviar aunque el correo de esta semana ya salió (para pruebas)'
        type: boolean
        default: false

permissions:
  contents: write   # necesario para commitear alertas-envios.json

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alerta:
    # Si viene por workflow_run, solo correr si la publicacion termino bien.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # El repo no lleva package-lock.json: se instala solo lo que el envio necesita.
      - name: Instalar nodemailer
        run: npm install nodemailer@6.10.1 --no-save --no-audit --no-fund

      - name: Ejecutar la alerta
        run: node scripts/alertas.js ${{ github.event_name == 'workflow_dispatch' && inputs.reenviar && '--force' || '' }}
        env:
          # lunes: una vez por semana. datos: tras publicar, solo si cambiaron las cifras.
          # manual: como el lunes (con "reenviar" se manda igual).
          ALERTA_MOTIVO: ${{ github.event_name == 'schedule' && 'lunes' || github.event_name == 'workflow_run' && 'datos' || 'manual' }}
          # El barrido de Meta: la alerta no tiene los datos en el repo, los pide aqui.
          TP_DATA_ENDPOINT: ${{ secrets.TP_DATA_ENDPOINT }}
          # Correo del hosting (alertas@limaretail.com). Si faltan, se usa Resend.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # En dispatch manual, respeta el input dry_run. En schedule/workflow_run, envía real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      - name: Registrar el envío en el repo
        if: >-
          success() &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas-envios.json
          if git diff --cached --quiet; then
            echo "Sin cambios en alertas-envios.json (no hubo envio)"
          else
            WEEK=$(TZ='America/Lima' date +'%Y-W%V')
            git commit -m "chore: alerta de Meta Ads ${WEEK} enviada"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
